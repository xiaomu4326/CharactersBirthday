[project]
name = "CharactersBirthday"
description = "Character Birthday Countdown"
version = "1.0.2"

[tool.flet.app]
module = "main"

[tool.flet]
product = "CharactersBirthday"
org = "com.charactersbirthday"

# 使用仓库内的自定义构建模板：在官方模板基础上，为 flutter_local_notifications
# 预置了 core library desugaring + multidex + desugar_jdk_libs（Android 通知所需）。
# 相对路径基于 `flet build` 的当前工作目录（请在仓库根目录执行）。
[tool.flet.template]
url = "apk/flet-template"

[tool.flet.android]
bundle_id = "com.charactersbirthday.app"

# 仅 Android 打包时安装的依赖；flet-android-notifications 内部带有 Flutter 扩展包
# （flutter/flet_android_notifications），`flet build` 会自动发现并注册。
dependencies = ["flet-android-notifications>=0.12.0"]

# 系统通知（flet-android-notifications / flutter_local_notifications）所需权限
[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
