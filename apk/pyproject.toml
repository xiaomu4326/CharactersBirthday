[project]
name = "CharactersBirthday"
description = "Character Birthday Countdown"
version = "1.0.8"

[tool.flet.app]
module = "main"

[tool.flet]
product = "CharactersBirthday"
org = "com.charactersbirthday"
# Android 的 versionCode：每次发版都要递增，系统才会认作升级
build_number = 8

# 使用仓库内的自定义构建模板：在官方模板基础上预置了 core library desugaring +
# multidex（Android 通知所需），并补充了 flutter_local_notifications 的闹钟 receiver。
# 路径相对于 pyproject.toml 所在目录（即本文件同级的 flet-template/）。
[tool.flet.template]
url = "flet-template"

[tool.flet.android]
bundle_id = "com.charactersbirthday.app"

# 仅 Android 打包时安装的依赖；flet-android-notifications 内部带有 Flutter 扩展包
# （flutter/flet_android_notifications），`flet build` 会自动发现并注册。
dependencies = ["flet-android-notifications>=0.12.0"]

# 系统通知（flet-android-notifications / flutter_local_notifications）所需权限
[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
# 生日提醒走 AlarmManager 精确闹钟：Android 12+ 需要这两个权限之一。
# USE_EXACT_ALARM 安装即授予（应用商店上架时有类目限制，本地安装无影响），
# SCHEDULE_EXACT_ALARM 作为兜底，用户可在系统设置里手动授予。
"android.permission.USE_EXACT_ALARM" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
